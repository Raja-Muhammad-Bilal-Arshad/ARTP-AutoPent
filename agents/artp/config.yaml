# config.yaml
mode: api        # "api" or "local"
api:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 1024
  api_key_env: OPENAI_API_KEY

local:
  model_path: /path/to/ggml-model-q4_0.bin
  backend: llama-cpp-python
  n_ctx: 2048
  temperature: 0.0
  max_tokens: 1024
timeout_seconds: 60
